name: Test action with valid config file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid config file (expect failure - wrong event type)
        id: action
        uses: .
        with:
          config-path: 'tests/fixtures/label-actions.yml'
        continue-on-error: true

      - name: Assert action failed (wrong event type, not missing config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail under workflow_dispatch event, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (workflow_dispatch is not a label event)"
