name: Test process-only pull requests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create label-actions config for PRs
        run: |
          mkdir -p .github
          cat > .github/label-actions.yml << 'EOF'
          enhancement:
            prs:
              comment: 'Thank you for this enhancement!'
          EOF

      - id: action
        name: Run label-actions with process-only prs
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: .github/label-actions.yml
          process-only: prs
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
