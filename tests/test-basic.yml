name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run label-actions with default config path
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: 'tests/fixtures/label-actions.yml'

      - name: Assert action ran and failed gracefully on wrong event type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is designed for labeled/unlabeled events.
          # Under workflow_dispatch, payload.label is undefined, so the action
          # fails with a TypeError — this is expected and correct behavior.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected on workflow_dispatch event (no label payload)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
