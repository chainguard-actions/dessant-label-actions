name: Test default config path behavior
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default config path (expect failure - no config file)
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed (no config file at default path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when default config file is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when default config file is missing"
