name: Test invalid process-only input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid process-only value
        id: action
        uses: .
        with:
          process-only: 'commits'
          config-path: '.github/label-actions-nonexistent-file.yml'
        continue-on-error: true

      - name: Assert action failed due to invalid process-only input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid process-only input, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid process-only input"
