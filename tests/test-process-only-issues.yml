name: Test process-only issues filter
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: 'invalid-token-for-testing'
          config-path: '.github/label-actions.yml'
          process-only: 'issues'

      - name: Assert action failed with expected error (not an unexpected crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid or config is missing
          # process-only: issues is a valid input and should be accepted
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing GitHub API access, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with process-only=issues (no valid GitHub API access in test environment)"
