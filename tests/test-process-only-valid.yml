name: Test process-only valid input values
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid process-only issues value (expect failure - no config)
        id: action-issues
        uses: .
        with:
          process-only: 'issues'
          config-path: '.github/label-actions-nonexistent.yml'
        continue-on-error: true

      - name: Assert action failed due to missing config (not invalid input)
        env:
          OUTCOME: ${{ steps.action-issues.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing config), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (missing config, not invalid input)"

      - name: Run action with valid process-only prs,discussions value (expect failure - no config)
        id: action-prs-discussions
        uses: .
        with:
          process-only: 'prs, discussions'
          config-path: '.github/label-actions-nonexistent.yml'
        continue-on-error: true

      - name: Assert action failed due to missing config (not invalid input)
        env:
          OUTCOME: ${{ steps.action-prs-discussions.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing config), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (missing config, not invalid input)"
