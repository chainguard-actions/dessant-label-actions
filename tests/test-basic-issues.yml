name: Test basic usage - issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create label-actions config
        run: |
          mkdir -p .github
          cat > .github/label-actions.yml << 'EOF'
          bug:
            issues:
              comment: 'Thank you for reporting this bug!'
          EOF

      - name: Create mock issue labeled event payload
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/payload.json << 'EOF'
          {
            "action": "labeled",
            "label": {
              "name": "bug"
            },
            "issue": {
              "number": 1,
              "title": "Test issue",
              "state": "open",
              "labels": [{"name": "bug"}],
              "user": {"login": "testuser"}
            },
            "repository": {
              "name": "test-repo",
              "full_name": "testowner/test-repo",
              "owner": {"login": "testowner"}
            },
            "sender": {"login": "testuser"}
          }
          EOF

      - id: action
        name: Run label-actions
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: .github/label-actions.yml
          process-only: issues
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to no real GitHub API in act environment,
          # but it should not fail due to missing config or bad inputs.
          # We accept both success and failure (API errors are expected in act).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
