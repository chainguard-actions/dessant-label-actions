name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run label-actions with custom config path
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: 'tests/fixtures/label-actions.yml'

      - name: Assert action ran (config path was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action fetches the config via GitHub API. If config-path is wrong,
          # it fails with "Missing configuration file". If the path is valid and
          # the file is committed, it proceeds to process the event payload.
          # Under workflow_dispatch, payload.label is undefined so the action
          # fails with a TypeError — both failure modes are acceptable here.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with custom config path (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Verify action fails with missing config path
        id: action_missing
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: 'tests/fixtures/nonexistent-config.yml'

      - name: Assert action fails on missing config
        env:
          OUTCOME: ${{ steps.action_missing.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with missing config file"
          else
            echo "FAIL: expected failure for missing config, got: $OUTCOME"
            exit 1
          fi
