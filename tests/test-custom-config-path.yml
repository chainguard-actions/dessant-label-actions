name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom config at non-default path
        run: |
          mkdir -p .github/custom
          cat > .github/custom/my-label-actions.yml << 'EOF'
          wontfix:
            issues:
              comment: 'This issue will not be fixed.'
              close: true
          EOF

      - id: action
        name: Run label-actions with custom config path
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: .github/custom/my-label-actions.yml
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with custom config path (outcome: ${{ steps.action.outcome }})"
