name: Test custom config path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom label-actions config at non-default path
        run: |
          mkdir -p .github/custom
          cat > .github/custom/my-label-actions.yml << 'EOF'
          wontfix:
            issues:
              close: true
              comment: 'This issue will not be fixed.'
          EOF

      - name: Run action with custom config-path
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: .github/custom/my-label-actions.yml
        continue-on-error: true

      - name: Assert action did not crash unexpectedly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
