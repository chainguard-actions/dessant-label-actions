name: Test process-only with multiple values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with comma-separated process-only values
        id: action
        uses: .
        with:
          process-only: 'issues, prs'
          config-path: '.github/label-actions-nonexistent-file.yml'
        continue-on-error: true

      - name: Assert action failed for expected reason (missing config, not validation error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the config file doesn't exist,
          # not because of invalid process-only input validation.
          # This confirms 'issues, prs' is a valid process-only value.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (missing config), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: comma-separated process-only input accepted, action failed on missing config"
