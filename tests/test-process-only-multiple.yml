name: Test process-only with multiple values
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create label-actions config
        run: |
          mkdir -p .github
          cat > .github/label-actions.yml << 'EOF'
          bug:
            issues:
              comment: 'Bug reported!'
            prs:
              comment: 'Bug fix PR!'
          EOF

      - id: action
        name: Run label-actions with process-only issues and prs
        uses: .
        with:
          github-token: ${{ github.token }}
          config-path: .github/label-actions.yml
          process-only: issues, prs
        continue-on-error: true

      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with multiple process-only values (outcome: ${{ steps.action.outcome }})"
