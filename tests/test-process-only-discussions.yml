name: Test process-only discussions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create label-actions config
        run: |
          mkdir -p .github
          cat > .github/label-actions.yml << 'EOF'
          question:
            discussions:
              comment: 'Thank you for your question!'
          EOF

      - name: Run label-actions with process-only=discussions
        id: action
        uses: .
        continue-on-error: true
        with:
          process-only: 'discussions'
        env:
          GITHUB_EVENT_NAME: discussion

      - name: Assert action completed (no crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
