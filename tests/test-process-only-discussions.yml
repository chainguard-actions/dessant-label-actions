name: Test process-only discussions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run label-actions with process-only discussions
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          config-path: 'tests/fixtures/label-actions.yml'
          process-only: 'discussions'

      - name: Assert action ran with process-only=discussions
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is designed for labeled/unlabeled events.
          # Under workflow_dispatch, payload.label is undefined, so the action
          # fails with a TypeError after loading config — this is expected.
          # The important thing is the action ran (not a startup crash).
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with process-only=discussions (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
